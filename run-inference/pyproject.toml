[project]
name = "run-inference"
version = "0.1.0"
description = "Run inference on a modified bris probably-cloudy checkpoint"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "anemoi-graphs==0.8.3",
    "anemoi-inference==0.8.2",
    "anemoi-models>=0.8.1",
    "bris-anemoi-plugins>=0.1.2",
    "ecmwf-api-client>=1.6.5",
    "numcodecs<0.16.0 ; platform_machine == 'aarch64'  and sys_platform == 'linux'",
    "torch>=2.9"
]

[build-system]
requires = [ "setuptools>=60", "setuptools-scm>=8" ]


[tool.uv] 
environments=[
    "sys_platform == 'linux' and platform_machine == 'x86_64'", 
    "sys_platform == 'linux' and platform_machine == 'aarch64'", 
    "sys_platform == 'darwin' and platform_machine == 'arm64'" 
] 
 
[tool.uv.sources] 
torch = [ 
     { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }, 
     { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" } 
] 

[[tool.uv.index]] 
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
run-inference = "inference.run:run"

[project.urls]
Homepage = "https://github.com/metno/bris-fiab"
Issues = "https://github.com/metno/bris-fiab/issues"
